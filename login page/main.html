<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truman Gym - Login</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Firebase SDKs (Compatibility Layer) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- Firebase Config -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCskz_rjvo9Gkd-W4iEbJjNRVlDH0fCtao",
            authDomain: "truman-gym-app.firebaseapp.com",
            projectId: "truman-gym-app",
            storageBucket: "truman-gym-app.firebasestorage.app",
            messagingSenderId: "344816844992",
            appId: "1:344816844992:web:8a79b0cf61d60497a32d25"
        };
        try {
            firebase.initializeApp(firebaseConfig);
            console.log("Firebase initialized:", firebase);
        } catch (err) {
            console.error("Firebase initialization failed:", err);
        }
    </script>
</head>
<body>

<!-- Landing Screen -->
<div class="landing-screen" id="landing">
    <img src="welcome-sticker.png" alt="Welcome Sticker" class="landing-image" />
    <h1 class="landing-title">Welcome to <br><span>Truman Gym</span></h1>
</div>

<!-- Login Section (Hidden initially) -->
<div class="container login-container animated-form" id="authSection" style="display: none;">
    <h2 class="title fancy-title">Join Our Community <span>Login</span></h2>

    <form id="loginForm" style="display: block;">
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <a href="#" class="forgot" id="forgotPasswordLink">Forgot Password?</a>
        <button type="submit">Login</button>
    </form>

    <!-- Password Reset Section (Hidden initially) -->
    <div id="resetPasswordSection" style="display: none;">
        <p>Enter your email to receive a password reset link.</p>
        <form id="resetPasswordForm">
            <input type="email" placeholder="Email" required />
            <button type="submit">Send Reset Link</button>
            <a href="#" id="backToLoginFromResetLink" class="switch">Back to Login</a>
        </form>
    </div>

    <!-- Password Reset Success Section (Hidden initially) -->
    <div id="resetSuccessSection" style="display: none;">
        <p>Please check your email to reset your password. Follow the instructions in the email to set a new password.</p>
        <a href="#" id="backToLoginFromSuccessLink" class="switch">Back to Login</a>
    </div>

    <!-- Google Login Button (custom with Google logo) -->
    <button class="google-btn" id="googleLoginBtn">
        <svg width="20" height="20" viewBox="0 0 48 48" style="margin-right: 8px;">
            <path fill="#4285F4" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#34A853" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#EA4335" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Continue with Google
    </button>

    <p class="switch">Don't have an account? <a href="register.html">Register here</a></p>
</div>

<!-- Your JS (loaded last, after everything) -->
<script src="main.js" type="text/javascript"></script>
</body>
</html>
