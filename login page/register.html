<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truman Gym - Register</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Firebase SDKs (Compatibility Layer) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- Firebase Config -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCskz_rjvo9Gkd-W4iEbJjNRVlDH0fCtao",
            authDomain: "truman-gym-app.firebaseapp.com",
            projectId: "truman-gym-app",
            storageBucket: "truman-gym-app.firebasestorage.app",
            messagingSenderId: "344816844992",
            appId: "1:344816844992:web:8a79b0cf61d60497a32d25"
        };
        try {
            firebase.initializeApp(firebaseConfig);
            console.log("Firebase initialized:", firebase);
        } catch (err) {
            console.error("Firebase initialization failed:", err);
        }
    </script>
</head>
<body>
<div class="container register-container animated-form">
    <h2 class="title">Register for Truman Gym</h2>
    <form id="registerForm" style="display: block;">
        <input type="text" placeholder="Full Name" required />
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required minlength="6" />
        <input type="password" placeholder="Confirm Password" required minlength="6" />
        <input type="text" placeholder="Phone Number" required />
        <input type="text" placeholder="Student ID" required />
        <input type="text" placeholder="Major / Department" required />
        <label for="dob">Birthdate</label>
        <input type="date" id="dob" name="dob" required />
        <select required>
            <option value="">Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <button type="submit">Register</button>
    </form>
    <div id="verificationSection" style="display: none;">
        <p>Please check your email for a verification link. Click the link to verify your email, then click below to continue.</p>
        <button id="verifyEmailBtn">I’ve Verified My Email</button>
    </div>
    <p class="switch">Already have an account? <a href="index.html">Login here</a></p>
</div>

<!-- Load JavaScript at the end to ensure DOM and Firebase are ready -->
<script src="main.js" type="text/javascript"></script>
</body>
</html>
