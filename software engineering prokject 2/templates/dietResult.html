<!DOCTYPE html>
<html>
<head>
  <title>Your Meal Plan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url("/static/background.png");
      background-size: contain;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: auto;
      position: relative;
    }
    pre {
      white-space: pre-wrap;
      font-family: monospace;
      background: #f9f9f9;
      padding: 15px;
      border-left: 4px solid #3e1d7b;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    h2 {
      color: #3e1d7b;
    }
    button {
      background-color: #510C76;
      color: white;
      border: none;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #62108f;
    }
  </style>
</head>
<body>
  <div class="container" id="plan-container">
    <h2>🧮 Final Nutrition Breakdown & Meal Plan</h2>
    <pre>{{ final_meal_plan }}</pre>
    <button onclick="downloadPDF()">📥 Download PDF</button>
    <br><br>
    <a href="/">← Generate another plan</a>
  </div>

  <!-- jsPDF & html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    async function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const container = document.getElementById('plan-container');

      const canvas = await html2canvas(container, { scale: 2 });
      const imgData = canvas.toDataURL('image/png');
      const pdf = new jsPDF('p', 'pt', 'a4');

      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();

      const ratio = Math.min(pageWidth / canvas.width, pageHeight / canvas.height);
      const imgWidth = canvas.width * ratio;
      const imgHeight = canvas.height * ratio;

      pdf.addImage(imgData, 'PNG', 20, 20, imgWidth - 40, imgHeight - 40);
      pdf.save("My_Diet_Plan.pdf");
    }
  </script>
</body>
</html>
