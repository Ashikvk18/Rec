<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diet Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url("/static/background.png");
      background-size: contain;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 90%;
    }

    h2 {
      text-align: center;
      color: purple;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #510C76;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #62108f;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.9);
      z-index: 999;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-size: 1.2rem;
    }

    .loading-spinner {
      border: 6px solid #eee;
      border-top: 6px solid #510C76;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .height-group {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>🍽️ Diet Plan Generator</h2>
    <form action="/generate-diet" method="POST" id="diet-form">
      <input type="number" name="age" placeholder="Age" required />
      <input type="number" name="weight" placeholder="Weight (lbs)" required />

      <div class="height-group">
        <input type="number" name="height_feet" placeholder="Height (ft)" required />
        <input type="number" name="height_inches" placeholder="Height (in)" required />
      </div>

      <select name="gender" required>
        <option value="" disabled selected>Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <select name="activity" required>
        <option value="" disabled selected>Activity Level</option>
        <option value="low">Low (sedentary)</option>
        <option value="medium">Medium (moderate)</option>
        <option value="high">High (active)</option>
      </select>

      <select name="goal" required>
        <option value="" disabled selected>Goal</option>
        <option value="lose">Lose Weight</option>
        <option value="gain">Gain Muscle</option>
        <option value="maintain">Maintain Weight</option>
      </select>

      <input type="text" name="preferences" placeholder="Food Preferences (e.g., vegetarian, halal)" />
      <input type="text" name="allergies" placeholder="Allergies (e.g., nuts, dairy)" />

      <button type="submit">Generate My Diet Plan</button>
    </form>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading">
    <div class="loading-spinner"></div>
    <div id="loading-status">Starting generation...</div>
  </div>

  <script>
    const form = document.getElementById('diet-form');
    const loading = document.getElementById('loading');
    const statusText = document.getElementById('loading-status');

    form.addEventListener('submit', () => {
      loading.style.display = 'flex';
      statusText.textContent = 'Step 1 of 4: Building initial plan...';

      setTimeout(() => {
        statusText.textContent = 'Step 2 of 4: Reviewing with second model...';
      }, 2000);

      setTimeout(() => {
        statusText.textContent = 'Step 3 of 4: Improving based on feedback...';
      }, 4000);

      setTimeout(() => {
        statusText.textContent = 'Step 4 of 4: Creating your daily meal schedule...';
      }, 6000);
    });
  </script>
</body>
</html>
